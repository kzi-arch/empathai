[project]
name = "empath"
version = "0.2.0"
description = "EmpathAI — teman curhat berbasis Gemini"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.4,<2.11",
    "pydantic-settings>=2.4.0,<2.7",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
    "langchain-chroma>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "pysqlite3-binary; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"